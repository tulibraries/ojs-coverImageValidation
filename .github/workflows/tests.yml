name: Plugin tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the hook dispatcher used by OJS 3.4.0-9
        uses: actions/checkout@v4
        with:
          repository: pkp/pkp-lib
          ref: f968cdafe19b256df0d649ebcc43399bfb695fee
          path: .test-deps/ojs/lib/pkp
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, fileinfo
          coverage: none

      - name: Check PHP syntax
        run: |
          find . -path './.test-deps' -prune -o -type f -name '*.php' -print0 |
            xargs -0 -n 1 php -l

      - name: Run image validation and hook regression tests
        env:
          OJS_SOURCE: ${{ github.workspace }}/.test-deps/ojs
        run: php tests/run.php

      - name: Verify missing extensions reject unchecked uploads
        env:
          OJS_SOURCE: ${{ github.workspace }}/.test-deps/ojs
          TEST_MISSING_EXTENSIONS: '1'
        run: php -n tests/run.php
